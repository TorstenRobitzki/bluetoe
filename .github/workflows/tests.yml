name: Tests

on:
    push:
    pull_request:
        branches: [ master ]
    workflow_dispatch:

# A new push to the same branch cancels the still running workflow of the previous push
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    unit-tests:
        name: Unit tests, ${{ matrix.name }}, ${{ matrix.build_type }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                # Debug is the primary configuration: it keeps the several hundred assert()s in the library
                # alive. Release proves that nothing depends on the debug instrumentation (NDEBUG removes
                # all asserts). See CLAUDE.md, "Building and testing".
                include:
                    - { name: Linux GCC,   os: ubuntu-latest, cc: gcc,   cxx: g++,     build_type: Debug }
                    - { name: Linux GCC,   os: ubuntu-latest, cc: gcc,   cxx: g++,     build_type: Release }
                    - { name: Linux Clang, os: ubuntu-latest, cc: clang, cxx: clang++, build_type: Debug }
                    - { name: Linux Clang, os: ubuntu-latest, cc: clang, cxx: clang++, build_type: Release }
                    - { name: macOS Clang, os: macos-latest,  cc: clang, cxx: clang++, build_type: Debug }

        steps:
            - uses: actions/checkout@v4

            - name: Install dependencies (Linux)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends libboost-dev ninja-build

            - name: Install dependencies (macOS)
              if: runner.os == 'macOS'
              run: brew install boost ninja

            - name: Configure
              run: >
                  cmake -S . -B build -G Ninja
                  -DBLUETOE_BUILD_UNIT_TESTS=ON
                  -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
                  -DCMAKE_C_COMPILER=${{ matrix.cc }}
                  -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

            - name: Build
              run: cmake --build build --parallel

            - name: Test
              run: ctest --test-dir build --parallel 4 --output-on-failure

    examples:
        name: nRF52 examples, code size
        runs-on: ubuntu-latest
        env:
            # Same compiler version as examples/docker/Dockerfile
            ARM_GCC_VERSION: 10.3-2021.10
            # The examples only need the nrfx MDK headers and the CMSIS core headers from the Nordic SDK.
            # Nordic's SDK download does not allow automated downloads, so the same headers are taken
            # from the public nrfx and CMSIS repositories and arranged in the SDK's directory layout.
            NRFX_VERSION: 2.5.0
            CMSIS_VERSION: 5.9.0

        steps:
            - uses: actions/checkout@v4

            - name: Cache toolchain and SDK headers
              id: cache-toolchain
              uses: actions/cache@v4
              with:
                  path: ~/toolchain
                  key: toolchain-arm-gcc-${{ env.ARM_GCC_VERSION }}-nrfx-${{ env.NRFX_VERSION }}-cmsis-${{ env.CMSIS_VERSION }}

            - name: Download toolchain and SDK headers
              if: steps.cache-toolchain.outputs.cache-hit != 'true'
              run: |
                  set -eu
                  mkdir -p ~/toolchain/nrf5_sdk/modules ~/toolchain/nrf5_sdk/components/toolchain/cmsis
                  curl -sSL -o gcc.tar.bz2 "https://developer.arm.com/-/media/Files/downloads/gnu-rm/${ARM_GCC_VERSION}/gcc-arm-none-eabi-${ARM_GCC_VERSION}-x86_64-linux.tar.bz2"
                  tar -C ~/toolchain -xf gcc.tar.bz2
                  curl -sSL -o nrfx.tar.gz "https://github.com/NordicSemiconductor/nrfx/archive/refs/tags/v${NRFX_VERSION}.tar.gz"
                  tar -xzf nrfx.tar.gz
                  mv "nrfx-${NRFX_VERSION}" ~/toolchain/nrf5_sdk/modules/nrfx
                  curl -sSL -o cmsis.tar.gz "https://github.com/ARM-software/CMSIS_5/archive/refs/tags/${CMSIS_VERSION}.tar.gz"
                  tar -xzf cmsis.tar.gz "CMSIS_5-${CMSIS_VERSION}/CMSIS/Core/Include"
                  mv "CMSIS_5-${CMSIS_VERSION}/CMSIS/Core/Include" ~/toolchain/nrf5_sdk/components/toolchain/cmsis/include

            - name: Install ninja
              run: |
                  sudo apt-get update
                  sudo apt-get install -y --no-install-recommends ninja-build

            - name: Configure
              run: >
                  cmake -S examples -B build_examples -G Ninja
                  -DCMAKE_BUILD_TYPE=Release
                  -DBLUETOE_BOARD=PCA10040
                  -DARM_GCC_TOOL_PATH=$HOME/toolchain/gcc-arm-none-eabi-${ARM_GCC_VERSION}
                  -DNRF5_SDK_ROOT=$HOME/toolchain/nrf5_sdk

            - name: Build
              run: cmake --build build_examples --parallel

            - name: Record binary sizes
              run: |
                  .github/scripts/report_sizes.sh "$HOME/toolchain/gcc-arm-none-eabi-${ARM_GCC_VERSION}/bin/arm-none-eabi-size" build_examples sizes
                  cat sizes/sizes.md >> "$GITHUB_STEP_SUMMARY"

            - name: Upload size report
              uses: actions/upload-artifact@v4
              with:
                  name: example-sizes-${{ github.sha }}
                  path: sizes/
